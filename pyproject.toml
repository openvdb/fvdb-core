[build-system]
requires = [
    "scikit-build-core",
]
build-backend = "scikit_build_core.build"

[project]
name = "fvdb-core"
version = "0.6.0.dev0"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # Require torch; users will choose the correct CUDA build from PyTorch's index.
    "torch>=2.8",
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    # Informational: CUDA requirement surfaced via README; no official CUDA classifier
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
viewer = ["nanovdb-editor>=0.1.6,<0.2.0"]
# Mesh/point-cloud loading and plotting used by fvdb.utils.examples. These are imported
# lazily, so the core package works without them; install with `pip install fvdb-core[examples]`.
examples = ["point_cloud_utils", "polyscope"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}-{build_type}"
build.verbose = false

[tool.scikit-build.cmake]
# Can override from command line using -C cmake.define.OPTION=value
define.FVDB_BUILD_TESTS = false
define.FVDB_BUILD_BENCHMARKS = false
define.FVDB_INSTALL_DEV = false
define.CMAKE_BUILD_TYPE = "Release"

[tool.scikit-build.install]
components = ["PythonModule"]

[tool.scikit-build.wheel]
packages = ["fvdb"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the `fvdb_test_utils` helper package importable. It deliberately lives under
# tests/ rather than inside fvdb/ so that it is not packaged into the wheel; it depends
# on the dev-only `parameterized` package declared in env/test_requirements.txt.
pythonpath = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".*", "build", "dist"]
