name: fvdb_learn
channels:
  - conda-forge
  - nodefaults
dependencies:
  - blas=*=mkl
  - ca-certificates
  - certifi
  - cuda-version=13.4
  - fvdb-core
  - git
  - ipython
  - ipywidgets
  - jupyterlab
  - linkify-it-py
  - matplotlib
  - numpy
  - openssl
  - pandas
  - parameterized
  - pip
  - pkg-config
  - polyscope
  - pyrender
  - pytest-benchmark
  - python=3.12
  # The build string labels this metapackage only. cuda-version selects the
  # CUDA build of pytorch itself.
  - pytorch-gpu=2.14.1=cuda134*
  - tensorboard
  - tqdm
  ## 3dgs
  - tyro
  - pillow
  - py-opencv>=4.10[build=headless*]
  - pyyaml
  - scikit-learn
  - torchvision
  - tyro
  - viser
  - pip:
    - point-cloud-utils
