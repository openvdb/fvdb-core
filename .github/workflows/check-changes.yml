#
# Reusable workflow: decide whether a PR needs testing, or touches only
# skippable (docs / non-code) paths. Callers gate their expensive jobs on the
# `should_test` output so skippable-only PRs skip the work while still
# reporting the required status checks (skipped == passed).

name: Check for relevant changes

on:
  workflow_call:
    outputs:
      should_test:
        description: "'true' unless every changed file is a skippable (docs/non-code) path"
        value: ${{ jobs.check-changes.outputs.should_test }}

# The scopes this workflow needs. Callers must grant at least these on the job
# that calls it; this block caps what the job receives. dorny/paths-filter runs
# only on pull_request_target, where it lists the PR's changed files through
# the REST API (pull-requests: read) and needs no checkout, so contents is not
# needed. If a scope is added here, add it to every caller's grant too.
permissions:
  pull-requests: read

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    outputs:
      # Run tests unless this is a PR whose files are ALL skippable paths.
      should_test: ${{ github.event_name != 'pull_request_target' || steps.filter.outputs.needs_tests == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request_target'
        with:
          # paths-filter's 'every' quantifies over PATTERNS PER FILE (a file
          # matches only if it satisfies all patterns of the list), while the
          # filter output is true when ANY changed file matches. So needs_tests
          # asks: does at least one changed file match '**' AND every negated
          # skippable path — i.e. is at least one changed file real source? A
          # skippable-only PR matches nothing, needs_tests is false, tests skip.
          #
          # NOTE: docs/ and notebooks/ are intentionally NOT excluded — the Doc Tests
          # job runs `pytest --markdown-docs docs` and `pytest --nbmake notebooks/`,
          # so changes there must run the suite. Only root-level `*.md` (README,
          # CHANGES, governance docs) is skippable; `docs/**/*.md` is not matched
          # by the `!*.md` exclusion and therefore still triggers tests.
          predicate-quantifier: 'every'
          filters: |
            needs_tests:
              - '**'
              - '!*.md'
              - '!CODEOWNERS'
              - '!debug/**'
              - '!devtools/**'
              - '!scripts/**'
