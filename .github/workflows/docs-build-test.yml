#
# Validate that the Sphinx documentation builds without errors or warnings,
# replicating the Read the Docs environment (see .readthedocs.yaml).

name: Documentation Build Test

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sphinx-build:
    name: Sphinx build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate version stub
        run: python devtools/generate-version-stub.py

      - name: Test coverage enforcement
        working-directory: tests
        run: |
          python -m pip install "pytest==9.0.3"
          python -m pytest ../.github/scripts/test_public_api_coverage.py -q

      - name: Build documentation
        run: sphinx-build -W --keep-going -a ./docs build/sphinx

      - name: Enforce public Python API coverage
        run: sphinx-build -W --keep-going -b coverage ./docs build/sphinx-coverage

      - name: Upload API coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-api-documentation-coverage
          path: |
            build/sphinx-coverage/python.txt
            build/sphinx-coverage/coverage.json
          if-no-files-found: ignore
