#
# A maintainer comments `/ok-to-test <full commit SHA>` on a pull request, and
# this workflow releases, for that PR at that commit:
# - the held runs of the gated pull_request_target workflows, by approving the
#   GitHub App's deployment protection rule; and
# - pull_request runs from a fork that GitHub holds under the repository's
#   fork-PR approval setting ("Approve and run").
# The gated side is approval-gate.yml. Prototyped and tested in
# openvdb/fvdb-ok-to-test-sandbox.
#
# REPOSITORY SETUP:
# - The fvdb-ok-to-test GitHub App is installed on this repository, with
#   repository permissions Deployments: read and write, Actions: read and
#   write, Metadata: read. It is enabled as the deployment protection rule of
#   the ci-external-approval environment.
# - Environment ok-to-test-bot: deployment branches limited to the default
#   branch; secret OK_TO_TEST_APP_KEY holds the App's private key.
# - Repository variables OK_TO_TEST_APP_CLIENT_ID (the App's client ID) and
#   OK_TO_TEST_APP_SLUG (its URL name).
#
# Security rules (this workflow is the security boundary for the gate):
# - issue_comment always runs this file from the default branch, never PR code.
#   Nothing here checks out or runs code.
# - Only newly created comments count; edits are ignored.
# - The commenter must have write access or higher, checked through the
#   collaborators API (author_association misreports private org members).
#   Anyone with write access can already run CI by pushing a branch here, so
#   requiring more than write would not narrow who can run privileged CI.
# - The comment must name the PR's current head as a FULL 40-character SHA. A
#   short SHA would let the PR author push a new commit with a matching prefix
#   just before the maintainer comments.
# - The comment body is untrusted: it is passed through an environment variable
#   and matched against a strict pattern, never interpolated into a script.
# - The App's private key lives in the ok-to-test-bot environment, which only
#   accepts the default branch.

name: ok-to-test

on:
  # zizmor: ignore[dangerous-triggers] Runs no PR code and checks nothing out; the comment body is matched against a strict pattern. See the security rules above.
  issue_comment:
    types: [created]

permissions: {}

env:
  # Workflow files whose held runs this command may release, and the
  # environment they wait on.
  GATED_WORKFLOWS: pr-tests.yml
  GATE_ENVIRONMENT: ci-external-approval

jobs:
  approve:
    name: Release held CI runs
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ok-to-test')
    runs-on: ubuntu-latest
    environment: ok-to-test-bot
    # Job level, not workflow level: every comment on the PR starts this
    # workflow, and a workflow-level group would let any later comment cancel
    # a pending /ok-to-test. Only comments that pass the `if` above get here.
    concurrency:
      group: ok-to-test-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: read # List the gated workflows' runs
      pull-requests: write # Reply on the pull request
    steps:
      - name: Check the commenter and the commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          reply() { printf '%s\n' "$1" > reply.md; echo "ok=false" >> "$GITHUB_OUTPUT"; }

          perm=$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" --jq '.permission') || perm=none
          echo "${COMMENTER}: ${perm}"
          case "$perm" in
            admin|write) ;;
            *) reply "@${COMMENTER} \`/ok-to-test\` needs write access to this repository. Nothing was approved."
               exit 0 ;;
          esac

          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}") || { reply "Could not read PR #${PR_NUMBER}. Nothing was approved."; exit 0; }
          head=$(jq -r '.head.sha' <<<"$pr")
          state=$(jq -r '.state' <<<"$pr")
          if [ "$state" != "open" ]; then
            reply "PR #${PR_NUMBER} is ${state}. Nothing was approved."
            exit 0
          fi

          first=$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r')
          re='^/ok-to-test[[:space:]]+([0-9a-fA-F]{40})[[:space:]]*$'
          if [[ ! "$first" =~ $re ]]; then
            reply "$(printf '%s\n\n%s\n\n%s' \
              "Usage: \`/ok-to-test <full 40-character commit SHA>\`. Nothing was approved." \
              "The head of this PR is currently \`${head}\`." \
              "Check that this is the commit you reviewed, then comment \`/ok-to-test ${head}\`.")"
            exit 0
          fi
          sha=$(tr 'A-F' 'a-f' <<<"${BASH_REMATCH[1]}")
          if [ "$sha" != "$head" ]; then
            reply "$(printf '%s\n\n%s' \
              "\`${sha}\` is not the head of this PR; the head is now \`${head}\`. Nothing was approved." \
              "Review the new commits, then comment \`/ok-to-test ${head}\`.")"
            exit 0
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Find the held runs for this commit
        id: runs
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          # Must match the run-name of the gated workflows (pr-tests.yml).
          title="PR #${PR_NUMBER} @ ${SHA}"
          since=$(date -u -d '-30 days' +%F) # held runs expire after 30 days

          # Every run records the head commit, repository and branch of the PR
          # that triggered it, for pull_request_target and pull_request alike.
          # Requiring them as well as the title means that a run of an older
          # workflow revision without our run-name (titled with the PR title,
          # which its author chooses) cannot pass for this PR, and neither can
          # another PR opened from a different branch with the same commit.
          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          head_ref=$(jq -r '.head.ref' <<<"$pr")
          is_this_pr() { # <run head sha> <run head repository> <run head branch>
            [ -n "$head_repo" ] && [ "$1" = "$SHA" ] && [ "$2" = "$head_repo" ] && [ "$3" = "$head_ref" ]
          }

          # The comment can arrive before a run reaches the gate (still queued,
          # or still classifying). Wait up to about 5 minutes for every
          # matching run to be waiting at the gate or past it.
          for attempt in $(seq 1 11); do
            : > runs.txt
            pending=0
            for wf in $GATED_WORKFLOWS; do
              gh api --paginate \
                "repos/${REPO}/actions/workflows/${wf}/runs?event=pull_request_target&head_sha=${SHA}&created=%3E%3D${since}&per_page=100" \
                --jq '.workflow_runs[] | [.id, .status, .head_sha, .head_repository.full_name, .head_branch, .display_title] | @tsv' > list.tsv
              while IFS=$'\t' read -r id status rev repo branch run_title; do
                if [ "$run_title" != "$title" ] || ! is_this_pr "$rev" "$repo" "$branch"; then
                  echo "Ignoring run ${id} (${run_title}; head ${repo}:${branch})."
                  continue
                fi
                case "$status" in
                  waiting) echo "$id" >> runs.txt ;;
                  completed) ;;
                  in_progress)
                    gate=$(gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=100" \
                             --jq '[.jobs[] | select(.name | endswith("Approval gate")) | .status] | first // "none"')
                    [ "$gate" = completed ] || pending=1 ;;
                  *) pending=1 ;;
                esac
              done < list.tsv
            done
            [ "$pending" = 0 ] && break
            [ "$attempt" -lt 11 ] || { echo "Gave up waiting for runs to reach the gate."; break; }
            echo "A run for ${SHA} has not reached the gate yet; checking again in 30s."
            sleep 30
          done

          # Fork pull_request runs held for "Approve and run", matched the same
          # way (they have no run-name to match).
          : > fork_runs.txt
          gh api --paginate \
            "repos/${REPO}/actions/runs?event=pull_request&status=action_required&head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_sha, .head_repository.full_name, .head_branch] | @tsv' > forks.tsv
          while IFS=$'\t' read -r id rev repo branch; do
            if is_this_pr "$rev" "$repo" "$branch"; then
              echo "$id" >> fork_runs.txt
            fi
          done < forks.tsv

          echo "Held gated runs:"; cat runs.txt
          echo "Fork runs awaiting approval:"; cat fork_runs.txt
          echo "count=$(( $(wc -l < runs.txt) + $(wc -l < fork_runs.txt) ))" >> "$GITHUB_OUTPUT"

      - name: Mint a token for the approval App
        id: app-token
        if: steps.check.outputs.ok == 'true' && steps.runs.outputs.count != '0'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OK_TO_TEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.OK_TO_TEST_APP_KEY }}
          permission-deployments: write # Approve the deployment protection rule
          permission-actions: write # Approve fork pull_request runs

      - name: Approve the held runs
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -uo pipefail
          approved=() failed=()
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api -X POST "repos/${REPO}/actions/runs/${id}/deployment_protection_rule" \
                 -f environment_name="$GATE_ENVIRONMENT" -f state=approved \
                 -f comment="Approved by @${COMMENTER} for ${SHA} (${COMMENT_URL})"; then
              approved+=("$id")
            else
              failed+=("$id")
            fi
          done < runs.txt
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api -X POST "repos/${REPO}/actions/runs/${id}/approve" --silent; then
              approved+=("$id")
            else
              failed+=("$id")
            fi
          done < fork_runs.txt
          {
            if [ ${#approved[@]} -eq 0 ] && [ ${#failed[@]} -eq 0 ]; then
              echo "No held runs found for \`${SHA}\`. Nothing was approved."
            else
              [ ${#approved[@]} -gt 0 ] && echo "Approved by @${COMMENTER} for \`${SHA}\`:"
              for id in "${approved[@]}"; do echo "- ${SERVER}/${REPO}/actions/runs/${id}"; done
              [ ${#failed[@]} -gt 0 ] && echo "Could not approve:"
              for id in "${failed[@]}"; do echo "- ${SERVER}/${REPO}/actions/runs/${id}"; done
            fi
          } > reply.md
          cat reply.md
          [ ${#failed[@]} -eq 0 ]

      # A step that fails before writing reply.md (an API error, a missing
      # App key or variable) would otherwise leave the PR with no answer.
      - name: Report an unexpected failure
        if: failure() && hashFiles('reply.md') == ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' "\`/ok-to-test\` failed before it finished, so some runs may not have been approved. See ${RUN_URL}" > reply.md

      - name: Reply on the pull request
        if: always() && hashFiles('reply.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@reply.md --silent
